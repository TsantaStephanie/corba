syntax = "proto3";

package traitement;

option java_multiple_files = true;
option java_package = "com.exemple.grpc.stub";

message VenteRequest {
  string produit = 1;
  int32 quantite = 2;
  double prix_unitaire = 3;
}

message VenteResponse {
  bool succes = 1;
  string message = 2;
  int64 id_vente = 3;
}

service ServiceTraitement {
  rpc EnregistrerVente (VenteRequest) returns (VenteResponse);
}